# AWS provider layer: shared by every AWS cluster. Clusters import it and override what they need.
import:
  - catalog/kubemarine

# Not secrets: which ~/.aws/config profile to use (`aws configure sso` / `aws configure --profile`).
env:
  AWS_PROFILE: my-profile

terraform:
  backend_type: s3
  backend:
    s3:
      bucket: my-tfstate-aws
      key: terraform.tfstate # atmos adds workspace_key_prefix=<component>, workspace = stack
      region: eu-central-1
      encrypt: true
      use_lockfile: true

components:
  terraform:
    infra:
      metadata:
        component: aws
      vars:
        region: eu-central-1
        # Node types: clusters reference them as `nodes.<name>.type`; override any field per cluster or per node.
        # Fields: roles (kubemarine), size, disk_size (default 50 GB), labels, taints.
        node_types:
          balancer:      { roles: [balancer],      size: t3.small }
          control-plane: { roles: [control-plane], size: t3.xlarge }
          worker:        { roles: [worker],        size: m6i.2xlarge }
