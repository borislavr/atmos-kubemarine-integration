# GCP provider layer: shared by every GCP cluster. Clusters import it and override what they need.
# Credentials: `gcloud auth application-default login` (or GOOGLE_APPLICATION_CREDENTIALS / WIF in CI).
import:
  - catalog/kubemarine

terraform:
  backend_type: gcs
  backend:
    gcs:
      bucket: my-tfstate-gcp # atmos adds prefix=<component>, workspace = stack

components:
  terraform:
    infra:
      metadata:
        component: gcp
      vars:
        project: my-gcp-project
        region: europe-west3
        zone: europe-west3-a
        # Node types: clusters reference them as `nodes.<name>.type`; override any field per cluster or per node.
        # Fields: roles (kubemarine), size, disk_size (default 50 GB), labels, taints.
        node_types:
          balancer:      { roles: [balancer],      size: e2-small }
          control-plane: { roles: [control-plane], size: e2-standard-4 }
          worker:        { roles: [worker],        size: e2-standard-8 }
