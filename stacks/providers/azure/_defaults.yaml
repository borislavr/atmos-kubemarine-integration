# azure provider defaults: everything provider-specific shared by all clusters placed in azure.
# A cluster is placed here by providers/azure/<cluster>.yaml (imports this file + clusters/<cluster>).
settings:
  provider: azure # stack name = <cluster>-azure

# Not secrets: which subscription to use. Credentials come from `az login` (or ARM_* env in CI).
env:
  ARM_SUBSCRIPTION_ID: 3a9387c7-b197-478e-a025-02f75de13143

terraform:
  backend_type: azurerm
  backend:
    azurerm:
      resource_group_name: tfstate
      storage_account_name: tfstate3a9387c7
      container_name: tfstate
      key: atmos # atmos appends /<component>.terraform.tfstate, workspace = stack
      use_azuread_auth: true

components:
  terraform:
    infra:
      metadata:
        component: azure
      vars:
        region: northeurope # westeurope VM sizes are restricted for this subscription
        # Size classes used by node types (catalog/node-types.yaml, clusters/*) -> VM sizes of this provider
        sizes:
          small:  Standard_B2s
          medium: Standard_D4s_v5
          large:  Standard_D8s_v5
          xlarge: Standard_D16s_v5
