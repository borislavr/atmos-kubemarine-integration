# openstack provider defaults: everything provider-specific shared by all clusters placed in openstack.
# A cluster is placed here by providers/openstack/<cluster>.yaml (imports this file + clusters/<cluster>).
settings:
  provider: openstack # stack name = <cluster>-openstack

# Not secrets: cloud name in ~/.config/openstack/clouds.yaml (password/app credential in secure.yaml).
env:
  OS_CLOUD: my-cloud

# State in the object store via its S3 API (Swift s3api / Ceph RGW).
terraform:
  backend_type: s3
  backend:
    s3:
      bucket: tfstate
      key: terraform.tfstate
      profile: openstack-tfstate # ~/.aws/credentials profile with `openstack ec2 credentials create` keys
      region: us-east-1 # ignored by S3-compatible stores, must be non-empty
      endpoints:
        s3: https://object-store.example.com
      use_path_style: true
      skip_credentials_validation: true
      skip_region_validation: true
      skip_requesting_account_id: true
      skip_metadata_api_check: true
      skip_s3_checksum: true
      use_lockfile: false # ponytail: no state locking; set true if the store supports conditional writes (If-None-Match)

# Per-cluster SSH key of the `ubuntu` user (atmos sshkey ensure|rotate): stored in the secret store per stack,
# never in git or terraform state. kubemarine gets the private key as a temp file for the duration of a run.
secrets:
  vars:
    SSH_PRIVATE_KEY: { store: ssh-keys-openstack, required: true, description: "SSH private key of the cluster nodes" }
    SSH_PUBLIC_KEY:  { store: ssh-keys-openstack, required: true, description: "SSH public key put on new VMs" }

components:
  terraform:
    infra:
      metadata:
        component: openstack
      vars:
        ssh_public_key: !secret SSH_PUBLIC_KEY
        external_network: public
        image: ubuntu-22.04
        # Size classes used by node types (catalog/node-types.yaml, clusters/*) -> VM sizes of this provider
        sizes:
          small:  m1.small
          medium: m1.large
          large:  m1.xlarge
          xlarge: m1.2xlarge # flavors differ per cloud: adjust to `openstack flavor list`
