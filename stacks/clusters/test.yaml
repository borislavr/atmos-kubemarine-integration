# Cluster `test`, provider-agnostic. Placed into a cloud by providers/<cloud>/test.yaml (stack `test-<cloud>`).
import:
  - catalog/node-types
  - catalog/kubemarine
  - catalog/kafka/small

vars:
  stage: test # cluster name, prefix of cloud resource names

components:
  terraform:
    infra:
      vars:
        admin_cidr: 72.56.49.160/28 # who may reach SSH and the Kubernetes API (ISP NAT pool .167-.172)
        nodes:
          control-plane-1: { type: control-plane }
          worker-1:        { type: worker }

    kubemarine:
      vars:
        cluster:
          cluster_name: test.k8s.local
