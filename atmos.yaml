base_path: "."

components:
  terraform:
    base_path: components/terraform
    deploy_run_init: true
    init_run_reconfigure: true
    auto_generate_backend_file: true
  helmfile:
    base_path: components/helmfile
    use_eks: false # kubeconfig comes from kubemarine (env KUBECONFIG), not from EKS

stacks:
  base_path: stacks
  included_paths: ["providers/**/*"]
  excluded_paths: ["**/_defaults.yaml"]
  name_template: "{{ .vars.stage }}-{{ .settings.provider }}" # <cluster>-<cloud>

# Go templates in stack manifests use <% %>: `{{ }}` stays free for kubemarine (jinja) and helm values.
templates:
  settings:
    enabled: true
    delimiters: ["<%", "%>"]

workflows:
  base_path: stacks/workflows

# Native CI (https://atmos.tools/ci): auto-enabled under GitHub Actions; terraform/helmfile write the job summary.
# Checks and PR comments are off: the workflow is manual (workflow_dispatch), there are no PRs to report to.
ci:
  enabled: true
  summary:
    enabled: true

commands:
  # cluster.yaml is rendered from the `kubemarine` component of the stack (nodes come from `infra` outputs);
  # kubemarine runs locally in .kubemarine/<stack>/ (cluster.yaml, procedure.yaml, kubeconfig, dump/, reports)
  - name: kubemarine
    description: "Run a kubemarine procedure for a cluster stack: atmos kubemarine <procedure> -s <stack> [--nodes a,b] [-- extra kubemarine args]"
    arguments:
      - name: procedure
        description: "install | add_node | remove_node | upgrade | backup | check_iaas | check_paas | do | ... (see `kubemarine help`)"
        required: true
    flags:
      - name: stack
        shorthand: s
        description: Cluster stack, e.g. test-azure
        required: true
      - name: nodes
        description: "add_node / remove_node: comma-separated node names from the stack"
      - name: dry-run
        type: bool
        description: "Only render and print cluster.yaml / procedure.yaml and the kubemarine command; do not run it"
    component_config:
      component: kubemarine
      stack: "{{ .Flags.stack }}"
    steps:
      - |
        {{- $proc := .Arguments.procedure }}
        {{- $cluster := .ComponentConfig.vars.cluster }}
        {{- $cfg := index (.ComponentConfig.vars.procedures | default dict) $proc }}
        {{- if has $proc (list "add_node" "remove_node") }}
          {{- $sel := splitList "," (required "--nodes is required" .Flags.nodes) }}
          {{- $picked := list }}{{ $rest := list }}
          {{- range $cluster.nodes }}{{ if has .name $sel }}{{ $picked = append $picked . }}{{ else }}{{ $rest = append $rest . }}{{ end }}{{ end }}
          {{- if ne (len $picked) (len $sel) }}{{ fail (printf "--nodes %s: some nodes are not in the infra outputs (apply infra first for add_node)" .Flags.nodes) }}{{ end }}
          {{- $cfg = merge (dict "nodes" $picked) ($cfg | default dict) }}
          {{- if eq $proc "add_node" }}{{ $cluster = set (deepCopy $cluster) "nodes" $rest }}{{ end }}
        {{- end }}
        set -e
        mkdir -p .kubemarine/{{ .Flags.stack }}
        cd .kubemarine/{{ .Flags.stack }}
        echo '{{ toJson $cluster }}' > cluster.yaml
        {{- if $cfg }}
        echo '{{ toJson $cfg }}' > procedure.yaml
        {{- end }}
        {{- $cmd := printf "kubemarine %s %s--config cluster.yaml %s" $proc (ternary "procedure.yaml " "" (not (empty $cfg))) .TrailingArgs }}
        {{- if eq (toString (index .Flags "dry-run")) "true" }}
        echo '--- .kubemarine/{{ .Flags.stack }}/cluster.yaml'
        echo '{{ toPrettyJson $cluster }}'
        {{- if $cfg }}
        echo '--- .kubemarine/{{ .Flags.stack }}/procedure.yaml'
        echo '{{ toPrettyJson $cfg }}'
        {{- end }}
        echo '--- dry run, not executed: {{ $cmd }}'
        {{- else }}
        {{ $cmd }}
        {{- end }}

  # Fetches the admin kubeconfig from the first control-plane (e.g. in CI or on a new machine) into
  # .kubemarine/<stack>/kubeconfig; API endpoint = first balancer, else first control-plane (public address).
  - name: kubeconfig
    description: "Fetch the cluster admin kubeconfig: atmos kubeconfig -s <stack>"
    flags:
      - name: stack
        shorthand: s
        description: Cluster stack, e.g. test-azure
        required: true
    component_config:
      component: kubemarine
      stack: "{{ .Flags.stack }}"
    steps:
      - |
        {{- $c := .ComponentConfig.vars.cluster }}
        {{- $cp := "" }}{{ $api := "" }}
        {{- range $c.nodes }}{{ if and (not $cp) (has "control-plane" .roles) }}{{ $cp = .address }}{{ end }}{{ end }}
        {{- range $c.nodes }}{{ if and (not $api) (has "balancer" .roles) }}{{ $api = .address }}{{ end }}{{ end }}
        {{- $f := printf ".kubemarine/%s/kubeconfig" .Flags.stack }}
        set -e
        mkdir -p .kubemarine/{{ .Flags.stack }}
        ssh -i {{ $c.node_defaults.keyfile }} -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 {{ $c.node_defaults.username }}@{{ required "no control-plane in infra outputs" $cp }} sudo cat /etc/kubernetes/admin.conf > {{ $f }}.tmp
        mv {{ $f }}.tmp {{ $f }}
        kubectl --kubeconfig {{ $f }} config set-cluster kubernetes --server https://{{ $api | default $cp }}:6443
        echo "KUBECONFIG={{ $f }}"
